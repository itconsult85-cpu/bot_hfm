name: Claude Code Action
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Hanya merespons komentar atau Issue yang mengandung @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Mengizinkan Claude memodifikasi kode
      pull-requests: write  # Mengizinkan Claude membuat PR
      issues: write
      id-token: write       # Untuk autentikasi default aplikasi GitHub
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@vv0.0.31
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
